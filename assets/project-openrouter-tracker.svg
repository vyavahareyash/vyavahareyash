t x="26" y="212" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#F2F2F5" text-anchor="start" letter-spacing="-0.3">OpenRouter Tracker</text><text x="394" y="212" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#CAE556" text-anchor="end">Homebrew</text><text x="26" y="238" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9AA6" text-anchor="start">Native desktop widget for OpenRouter credits,</text><text x="26" y="258" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9AA6" text-anchor="start">spend velocity and rate limits.</text><rect x="26" y="278" width="356" height="34" rx="17" fill="#0B0B0F" stroke="#26262E"/><text x="40" y="299" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#F2F2F5" text-anchor="start">brew install vyavahareyash/tap/openrouter-tracker</text></svg>