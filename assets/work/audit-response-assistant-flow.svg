<svg xmlns="http://www.w3.org/2000/svg" width="840" height="178" viewBox="0 0 840 178" role="img" aria-label="How it works: Audit request → Parse embedded documents → Rank similar past responses → Draft an answer linked to evidence → Route to the right expert."><title>How it works: Audit request → Parse embedded documents → Rank similar past responses → Draft an answer linked to evidence → Route to the right expert.</title><rect x="6" y="6" width="828" height="166" rx="18" fill="#14141A" stroke="#26262E"/><text x="30" y="44" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9A9AA6" text-anchor="start">how it works</text><style>
.flow{stroke-dasharray:3 4;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.hit{animation:hit 5s ease-in-out infinite}
@keyframes hit{0%,30%,100%{stroke:#33333D}10%,20%{stroke:#CAE556}}
.wave{animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gauge{animation:gauge 1.6s ease-out both}
@keyframes gauge{from{stroke-dashoffset:213.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="30.0" y="66" width="132.0" height="78" rx="12" fill="#1A1A21" stroke="#3A3A46" stroke-width="1"/><text x="96.0" y="109.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">Audit request</text><line x1="166.0" y1="105.0" x2="184.0" y2="105.0" stroke="#9A9AA6" stroke-width="1.5" class="flow"/><path d="M183.0 101.0L188.0 105.0L183.0 109.0Z" fill="#9A9AA6"/><rect x="192.0" y="66" width="132.0" height="78" rx="12" fill="#1A1A21" stroke="#3A3A46" stroke-width="1"/><text x="258.0" y="100.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">Parse embedded</text><text x="258.0" y="118.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">documents</text><line x1="328.0" y1="105.0" x2="346.0" y2="105.0" stroke="#9A9AA6" stroke-width="1.5" class="flow"/><path d="M345.0 101.0L350.0 105.0L345.0 109.0Z" fill="#9A9AA6"/><rect x="354.0" y="66" width="132.0" height="78" rx="12" fill="#1A1A21" stroke="#3A3A46" stroke-width="1"/><text x="420.0" y="100.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">Rank similar past</text><text x="420.0" y="118.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">responses</text><line x1="490.0" y1="105.0" x2="508.0" y2="105.0" stroke="#9A9AA6" stroke-width="1.5" class="flow"/><path d="M507.0 101.0L512.0 105.0L507.0 109.0Z" fill="#9A9AA6"/><rect x="516.0" y="66" width="132.0" height="78" rx="12" fill="#1A1A21" stroke="#3A3A46" stroke-width="1"/><text x="582.0" y="100.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">Draft an answer</text><text x="582.0" y="118.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">linked to evidence</text><line x1="652.0" y1="105.0" x2="670.0" y2="105.0" stroke="#9A9AA6" stroke-width="1.5" class="flow"/><path d="M669.0 101.0L674.0 105.0L669.0 109.0Z" fill="#9A9AA6"/><rect x="678.0" y="66" width="132.0" height="78" rx="12" fill="#1A1A21" stroke="#CAE556" stroke-width="1.5"/><text x="744.0" y="100.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">Route to the right</text><text x="744.0" y="118.0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F2F2F5" text-anchor="middle">expert</text></svg>