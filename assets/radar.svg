<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="650" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Inter:wght@600&amp;display=swap');
      .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94A3B8; font-weight: 600; }
      .title { font-family: 'Inter', sans-serif; font-size: 13px; fill: #F8FAFC; font-weight: 700; }
    </style>
    <linearGradient id="radar-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="650" height="360" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>
  <text x="325" y="32" text-anchor="middle" class="title">TECHNICAL COMPETENCY RADAR</text>

  <!-- Center (325, 195) -->
  <g transform="translate(325, 195)">
    <!-- Ring 1 (100%) -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="#1E293B" stroke-width="1"/>
    <!-- Ring 2 (75%) -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Ring 3 (50%) -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Ring 4 (25%) -->
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Axis Lines -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="104" y2="-60" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="104" y2="60" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="-104" y2="60" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="-104" y2="-60" stroke="#1E293B" stroke-width="1"/>

    <!-- Data Polygon -->
    <!-- GenAI Agents: 95% (0, -114) -->
    <!-- Enterprise RAG: 92% (95, -55) -->
    <!-- Computer Vision/ViTs: 88% (91, 52) -->
    <!-- Geospatial ML: 85% (0, 102) -->
    <!-- Cloud & Azure: 82% (-85, 49) -->
    <!-- LLM Observability: 88% (-91, -52) -->
    <polygon points="0,-114 95,-55 91,52 0,102 -85,49 -91,-52" fill="url(#radar-fill)" stroke="#38BDF8" stroke-width="2"/>

    <!-- Vertices dots -->
    <circle cx="0" cy="-114" r="4" fill="#38BDF8"/>
    <circle cx="95" cy="-55" r="4" fill="#38BDF8"/>
    <circle cx="91" cy="52" r="4" fill="#818CF8"/>
    <circle cx="0" cy="102" r="4" fill="#C084FC"/>
    <circle cx="-85" cy="49" r="4" fill="#818CF8"/>
    <circle cx="-91" cy="-52" r="4" fill="#38BDF8"/>

    <!-- Labels -->
    <text x="0" y="-130" text-anchor="middle" class="label" fill="#38BDF8">GENAI / AGENTS (95%)</text>
    <text x="118" y="-62" text-anchor="start" class="label">ADVANCED RAG (92%)</text>
    <text x="118" y="66" text-anchor="start" class="label">VISION TRANSFORMERS (88%)</text>
    <text x="0" y="140" text-anchor="middle" class="label" fill="#C084FC">GEOSPATIAL ML (85%)</text>
    <text x="-118" y="66" text-anchor="end" class="label">AZURE &amp; CLOUD (82%)</text>
    <text x="-118" y="-62" text-anchor="end" class="label">EVALS &amp; OPS (88%)</text>
  </g>
</svg>
