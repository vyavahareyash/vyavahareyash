<svg xmlns="http://www.w3.org/2000/svg" width="420" height="344" viewBox="0 0 420 344" role="img" aria-label="Cashflow (5 platforms): Offline personal finance app. Speak your spending and an on-device SLM logs it. Android · macOS · Windows · Linux · Web"><title>Cashflow (5 platforms): Offline personal finance app. Speak your spending and an on-device SLM logs it. Android · macOS · Windows · Linux · Web</title><style>
.flow{stroke-dasharray:3 4;animation:flow 1.2s linear infinite}
