<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="920" height="290">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#151D2E" stroke-width="1"/>
    </pattern>
    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-azure" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>
    <!-- Linear Gradients -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', -apple-system, sans-serif; }
      .pulse-node { animation: pulse 2.5s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 0.35; transform: scale(0.98); } to { opacity: 0.95; transform: scale(1.02); } }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="290" rx="14" fill="#0A0E17"/>
  <rect width="920" height="290" rx="14" fill="url(#grid)"/>
  <rect width="920" height="290" rx="14" fill="url(#glow-cyan)"/>
  <rect width="920" height="290" rx="14" fill="url(#glow-azure)"/>

  <!-- Border Frame -->
  <rect x="14" y="14" width="892" height="262" rx="10" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="14" y="14" width="160" height="2" fill="url(#line-grad)"/>

  <!-- Top Status Pill -->
  <g transform="translate(40, 38)">
    <rect width="265" height="26" rx="13" fill="#111B2E" stroke="#1E2D4A" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981" class="pulse-node"/>
    <text x="26" y="17" class="mono" font-size="11" fill="#94A3B8" font-weight="600">PRODUCTION AI @ UBS  ·  EX-ISRO</text>
  </g>

  <!-- Main Headline -->
  <text x="40" y="120" class="sans" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Yash Vyavahare
  </text>

  <!-- Subtitle -->
  <text x="40" y="155" class="mono" font-size="16" font-weight="600" fill="#38BDF8">
    AI Engineer  //  Multi-Agent Systems &amp; Production RAG
  </text>

  <!-- Bio & Core Impact -->
  <text x="40" y="196" class="mono" font-size="13" fill="#94A3B8">
    <tspan fill="#64748B">&gt; </tspan>Architecting enterprise agent context &amp; advanced RAG memory layers.
  </text>
  <text x="40" y="220" class="mono" font-size="13" fill="#94A3B8">
    <tspan fill="#64748B">&gt; </tspan>Geospatial analysis &amp; orbital change detection (ISRO SAC research).
  </text>
  <text x="40" y="244" class="mono" font-size="13" fill="#94A3B8">
    <tspan fill="#64748B">&gt; </tspan>Stack: Python · Azure OpenAI · LangChain · PyTorch · FastAPI
  </text>
</svg>
