<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Inter:wght@500;600&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
    <linearGradient id="flow-arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="900" height="160" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Stage 1: Ingestion -->
  <g transform="translate(25, 25)">
    <rect width="180" height="110" rx="8" fill="#131F37" stroke="#253556" stroke-width="1"/>
    <text x="16" y="32" class="mono" font-size="11" fill="#38BDF8">01 // INGESTION</text>
    <text x="16" y="58" class="sans" font-size="14" font-weight="600" fill="#F8FAFC">Raw Inputs</text>
    <text x="16" y="80" class="mono" font-size="11" fill="#94A3B8">• Satellite Tiles</text>
    <text x="16" y="98" class="mono" font-size="11" fill="#94A3B8">• Nested Docs &amp; Logs</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 215 80 L 245 80" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="245,76 253,80 245,84" fill="#38BDF8"/>

  <!-- Stage 2: Processing & Vision -->
  <g transform="translate(260, 25)">
    <rect width="180" height="110" rx="8" fill="#131F37" stroke="#253556" stroke-width="1"/>
    <text x="16" y="32" class="mono" font-size="11" fill="#818CF8">02 // EXTRACTION</text>
    <text x="16" y="58" class="sans" font-size="14" font-weight="600" fill="#F8FAFC">Vision &amp; Parsing</text>
    <text x="16" y="80" class="mono" font-size="11" fill="#94A3B8">• ViT Transformers</text>
    <text x="16" y="98" class="mono" font-size="11" fill="#94A3B8">• Multi-modal Parsing</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 450 80 L 480 80" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="480,76 488,80 480,84" fill="#818CF8"/>

  <!-- Stage 3: Agent Orchestration -->
  <g transform="translate(495, 25)">
    <rect width="180" height="110" rx="8" fill="#131F37" stroke="#253556" stroke-width="1"/>
    <text x="16" y="32" class="mono" font-size="11" fill="#C084FC">03 // REASONING</text>
    <text x="16" y="58" class="sans" font-size="14" font-weight="600" fill="#F8FAFC">Agent Mesh</text>
    <text x="16" y="80" class="mono" font-size="11" fill="#94A3B8">• LangChain / RAG</text>
    <text x="16" y="98" class="mono" font-size="11" fill="#94A3B8">• Centralized Memory</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 685 80 L 715 80" stroke="#C084FC" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="715,76 723,80 715,84" fill="#C084FC"/>

  <!-- Stage 4: Production Decision -->
  <g transform="translate(730, 25)">
    <rect width="145" height="110" rx="8" fill="#1A1838" stroke="#3C3466" stroke-width="1"/>
    <text x="14" y="32" class="mono" font-size="11" fill="#34D399">04 // OUTCOME</text>
    <text x="14" y="58" class="sans" font-size="14" font-weight="600" fill="#F8FAFC">Production</text>
    <text x="14" y="80" class="mono" font-size="11" fill="#94A3B8">• Risk Closure</text>
    <text x="14" y="98" class="mono" font-size="11" fill="#94A3B8">• Canopy Alerts</text>
  </g>
</svg>
